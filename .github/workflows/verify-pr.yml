name: verify-pr

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-linux:
    name: Verify fixture gate (Linux pinned container)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false

      - name: Reject tracked local inputs and generated packs
        shell: bash
        run: |
          set -euo pipefail
          tracked_ignored="$(git ls-files -ci --exclude-per-directory=.gitignore)"
          if [[ -n "$tracked_ignored" ]]; then
            printf 'Ignored paths are tracked:\n%s\n' "$tracked_ignored" >&2
            exit 1
          fi

      - name: Exact-path proofs (tracked files)
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch -- \
            PLAN.md \
            ARCHITECTURE.md \
            tests/fixtures/build.py \
            tests/fixtures/expectations.json \
            specs/sql/common_meta.sql \
            specs/sql/quran_core.v1.sql \
            specs/sql/quran_scripts_extended.v1.sql \
            specs/sql/quran_translation.v1.sql \
            specs/sql/quran_tafsir.v1.sql \
            specs/sql/quran_morphology.v1.sql \
            specs/sql/quran_wbw.v1.sql \
            specs/sql/hadith_book.v1.sql \
            specs/catalog.schema.json \
            specs/audio-manifest.schema.json \
            specs/inputs/tafsir-input.schema.json \
            specs/inputs/hadith-input.schema.json \
            tests/fixtures/inputs/sqlite/quran-core.json \
            tests/fixtures/inputs/sqlite/quran-scripts-extended.json \
            tests/fixtures/inputs/sqlite/quran-tr-en-fixture.json \
            tests/fixtures/inputs/sqlite/quran-morphology.json \
            tests/fixtures/inputs/sqlite/quran-wbw-en.json \
            tests/fixtures/inputs/hadith/fixture.json \
            tests/fixtures/inputs/hadith/fixture.splits.json \
            tests/fixtures/inputs/qul/tafsir-ar-fixture.json

      - name: Build pinned toolchain image
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -f pipelines/toolchain/Dockerfile -t quality-gate-toolchain .

      - name: Run PR verification recipe in read-only /repo
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev \
            --mount type=bind,src="${GITHUB_WORKSPACE}",dst=/repo,readonly \
            -w /repo \
            -e HOME=/tmp/home \
            -e TMPDIR=/tmp \
            -e TMP=/tmp \
            -e TEMP=/tmp \
            -e PYTHONDONTWRITEBYTECODE=1 \
            quality-gate-toolchain \
            bash -lc '
              set -euo pipefail
              TMP="$(mktemp -d /tmp/verify-XXXXXX)"
              python -m pipelines.toolchain.check_runtime
              python -m pytest -q -p no:cacheprovider
              python -m tests.fixtures.build --root "$TMP"
              python -m pipelines.validators.quality_gate --profile fixture --candidate "$TMP/candidate" --rebuild "$TMP/rebuild" --sources-root "$TMP/source" --expectations tests/fixtures/expectations.json
            '

  verify-windows:
    name: Verify fixture gate (Windows 3.13.3 + GyanD 7.1.1)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false

      - name: Download and install pinned Python 3.13.3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = Get-Content -Raw pipelines/toolchain/identity.json | ConvertFrom-Json
          $py = $identity.'windows-x64'.artifacts.'python-3.13.3-amd64.exe'

          $installer = Join-Path $env:RUNNER_TEMP 'python-3.13.3-amd64.exe'
          Invoke-WebRequest -Uri $py.url -OutFile $installer

          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          $expected = $py.sha256.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "SHA-256 mismatch for python installer: expected $expected got $actual"
          }

          $dest = Join-Path $env:RUNNER_TEMP 'python-3.13.3'
          $proc = Start-Process -FilePath $installer -ArgumentList "/quiet TargetDir=`"$dest`" InstallAllUsers=0 Include_test=0 SimpleInstall=1 PrependPath=0 Shortcuts=0 Include_launcher=0" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "Python installer failed with exit code $($proc.ExitCode)"
          }
          $pyExe = Join-Path $dest 'python.exe'
          if (!(Test-Path $pyExe)) {
            throw "Python executable not found at $pyExe after install"
          }
          $scripts = Join-Path $dest 'Scripts'
          Add-Content -Path $env:GITHUB_PATH -Value $dest
          Add-Content -Path $env:GITHUB_PATH -Value $scripts
      - name: Download and verify pinned GyanD essentials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = Get-Content -Raw pipelines/toolchain/identity.json | ConvertFrom-Json
          $ff = $identity.'windows-x64'.artifacts.'ffmpeg-7.1.1-essentials_build.zip'

          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg-7.1.1-essentials_build.zip'
          Invoke-WebRequest -Uri $ff.url -OutFile $zip

          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          $expected = $ff.sha256.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "SHA-256 mismatch for ffmpeg zip: expected $expected got $actual"
          }

          $dest = Join-Path $env:RUNNER_TEMP 'review-media'
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          $bin = Join-Path $dest 'ffmpeg-7.1.1-essentials_build\bin'
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      - name: Install test requirements
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --only-binary=:all: --require-hashes -r requirements-test.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run PR verification recipe (synthetic data only)
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tmp = Join-Path $env:RUNNER_TEMP ("verify-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $tmp | Out-Null

          python -m pipelines.toolchain.check_runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q -p no:cacheprovider
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tests.fixtures.build --root $tmp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pipelines.validators.quality_gate --profile fixture --candidate (Join-Path $tmp 'candidate') --rebuild (Join-Path $tmp 'rebuild') --sources-root (Join-Path $tmp 'source') --expectations tests/fixtures/expectations.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
